id: us-fiscal-inflation
name: US fiscal path, inflation and rates
domain: economy
question: By the end of 2029, has the US absorbed its high debt with inflation back near 2%, or hit a bond-market or stagflation episode?
poles:
- Inflation near 2%, rate cuts and orderly Treasury markets
- Stagflation with a buyers' strike in long Treasuries
impact: 4
impact_why: CBO projects record debt (107% of GDP) and record interest costs by 2029. A long-yield spike would reprice mortgages, credit and assets worldwide.
uncertainty: 3
uncertainty_why: Rising debt is near-certain; inflation and the bond market are open. September 2026 CPI was 3.7% and markets price a December hike near 72%, yet the Fed's median sees inflation near 2.3% in 2027.
resolves_by_2029: partly
scored: '2026-11-04'
