id: us-institutions
name: US institutional stability
domain: politics
question: By the end of 2029, has the US held a 2028 election whose result was accepted and transferred normally, with courts and Congress working as checks, or did it bring a contested transfer, emergency powers at home or open defiance of courts?
poles:
- Normal 2029 transfer with checks restored
- Contested 2028 transfer under emergency powers
impact: 4
impact_why: V-Dem's 2026 report downgraded the US to an electoral democracy. A contested transfer at the reserve-currency issuer would hit markets, the dollar and alliances well beyond the US.
uncertainty: 4
uncertainty_why: 'Signals split: a Manifold market gives about 75% to a normal transfer and Bright Line Watch''s expert rating rose to a term high in July 2026, while election experts surveyed in January 2026 worried about federal interference in elections.'
resolves_by_2029: 'yes'
scored: '2026-11-04'
