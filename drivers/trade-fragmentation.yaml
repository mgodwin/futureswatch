id: trade-fragmentation
name: Trade fragmentation
domain: economy
question: By the end of 2029, has world trade settled into a stable higher-tariff system, or split into rival blocs with embargoes on critical inputs?
poles:
- 'Managed truce: tariffs high but stable, trade rerouted'
- 'Bloc decoupling: lapsed truce, rare-earth and chip embargoes'
impact: 3
impact_why: The 2025 tariff shock was absorbed better than feared, per the IMF. Only full decoupling would be era-defining.
uncertainty: 3
uncertainty_why: 'Elevated tariffs are near-certain. Escalation versus truce is open: the US-China truce runs on short rolling extensions and heavy rare-earth exports remain about half their pre-control level.'
resolves_by_2029: partly
scored: '2026-11-04'
