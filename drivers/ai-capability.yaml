id: ai-capability
name: AI capability trajectory
domain: tech
question: By the end of 2029, can frontier AI do most remote expert knowledge work, or automate most AI research, and is it deployed at scale?
poles:
- Transformative, expert-level general agents
- Powerful but jagged tools that stop short of replacing experts
impact: 5
impact_why: 'Capability sits upstream of most other drivers: diffusion, control, compute demand and the investment cycle. METR''s January 2026 update says task horizons are growing faster than the old seven-month doubling.'
uncertainty: 5
uncertainty_why: 'Forecasts split widely: Manifold gives 53% for AGI before 2030, Metaculus has a February 2031 median, and the FRI LEAP panel''s medians are 2047 for superforecasters and 2050 for experts. Lab leaders cluster around 2027 to 2030.'
resolves_by_2029: partly
scored: '2026-11-04'
correlated_with:
- id: energy-compute
  why: power and chips bound scaling
- id: ai-investment-cycle
  why: funding for training runs
- id: ai-control
  why: brakes could slow it
- id: us-china-taiwan
  why: chip supply shock
