id: ai-investment-cycle
name: AI investment cycle and financial stability
domain: economy
question: By the end of 2029, has the AI capex boom kept going, gone through a sharp correction and recovered, or busted into credit losses and recession?
poles:
- Capex passes $1T a year and stays there, funded from revenue
- Capex is cut and data-center debt defaults spread into recession
impact: 5
impact_why: Big Tech AI capex is about $725 to 785B in 2026, heading toward $1T in 2027, and it props up US growth. The BIS, IMF, Bank of England and RBA all name an AI unwind as a top financial-stability risk.
uncertainty: 5
uncertainty_why: The repo splits 29 sustained, 46 correction, 25 bust, with no dominant outcome. Analysts keep raising 2027 capex estimates while several hyperscalers' free cash flow has turned negative and data-center bond yields hit records.
resolves_by_2029: 'yes'
scored: '2026-11-04'
correlated_with:
- id: ai-capability
  why: revenue only justifies capex if capability keeps climbing
- id: ai-diffusion
  why: enterprise adoption drives revenue
- id: energy-compute
  why: power caps the build-out
- id: us-fiscal-inflation
  why: rates set the cost of data-center debt
