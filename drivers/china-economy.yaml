id: china-economy
name: China's economic trajectory
domain: economy
question: By the end of 2029, is China growing around 4% with deflation behind it, or stuck in a debt-deflation slump near 2 to 3%?
poles:
- Steady 4 to 5% growth and tech self-reliance
- Balance-sheet stagnation and renewed deflation
impact: 3
impact_why: China is about a fifth of world output, but a one-to-two-point growth gap matters less to daily life elsewhere than AI, rates or war.
uncertainty: 2
uncertainty_why: Recent data are steady (Q3 2026 growth 4.5%, deflator turned positive in Q2) and the consensus range for 2027 to 2029 is narrow.
