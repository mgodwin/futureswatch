id: ai-diffusion
name: AI diffusion into work
domain: tech
question: By the end of 2029, has AI measurably raised productivity growth and reshaped employment in major economies, or is it still a niche, firm-level effect?
poles:
- Broad productivity surge with visible white-collar job restructuring
- Shallow adoption with little aggregate productivity or job effect
impact: 5
impact_why: 'This is how most people would feel AI by 2029: through jobs, wages and prices. Gallup found 52% of US workers using AI in Q2 2026, and Stanford finds entry-level employment in AI-exposed jobs about 19% below peers.'
uncertainty: 4
uncertainty_why: 'Adoption is fast but measured effects are small: in an NBER survey of about 6,000 executives, 89% of firms report no productivity impact so far, while expecting about 1.4% over the next three years.'
resolves_by_2029: partly
scored: '2026-11-04'
correlated_with:
- id: ai-capability
  why: sets the ceiling
