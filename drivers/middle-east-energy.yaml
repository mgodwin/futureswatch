id: middle-east-energy
name: Middle East war and oil shocks
domain: geopolitics
question: By the end of 2029, has the Iran war settled with Hormuz open and oil near $70 to 80, or become a recurring or wider Gulf war that keeps oil shocks central?
poles:
- Settlement, Hormuz open and a 2027 oil glut
- Wider Gulf war with oil above $150
impact: 4
impact_why: The 2026 war pushed Brent above $100, though the IMF held global growth near 3.1% because the world uses less oil per unit of output. A regional war with oil above $150 for months would plausibly cause a global recession.
uncertainty: 4
uncertainty_why: Repo odds are 48 settled, 37 simmering, 15 regional, and 2027 oil forecasts split from about $69 (EIA) to $86 (Rabobank).
resolves_by_2029: partly
scored: '2026-11-04'
