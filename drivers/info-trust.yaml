id: info-trust
name: Information ecosystem and trust
domain: tech
question: By the end of 2029, has AI-generated content broken shared factual baselines, or have trust and provenance norms stabilized?
poles:
- Deepfake-driven breakdown with contested elections and collapsing trust
- Trust stabilizes through provenance, platform norms and adaptation
impact: 3
impact_why: It shapes politics and how other shocks are perceived more than daily economics. Global trust in news hit 37% in the 2026 Reuters Digital News Report, the lowest since 2015.
uncertainty: 2
uncertainty_why: Slow erosion is the consensus direction. Whether a single AI-misinformation event swings a major election is uncertain, but measured effects on votes so far are weak, and no market prices it.
resolves_by_2029: partly
scored: '2026-11-04'
