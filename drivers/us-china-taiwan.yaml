id: us-china-taiwan
name: US-China rivalry and Taiwan
domain: geopolitics
question: By the end of 2029, has US-China rivalry stayed managed competition, or has China moved to blockade, quarantine or war over Taiwan?
poles:
- Managed rivalry under a trade truce
- Taiwan blockade or US-China war
impact: 5
impact_why: Bloomberg Economics estimates a one-year blockade cuts world GDP about 5% and a war about 10%, and it would set back AI hardware everywhere.
