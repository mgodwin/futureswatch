id: climate-impacts
name: Climate impacts and extreme events
domain: environment
question: By the end of 2029, have climate extremes caused system-level shocks in major economies, and has emissions policy sped up or stalled?
poles:
- El Nino-driven food and insurance shocks
- Hot but absorbed while emissions plateau
impact: 3
impact_why: El Nino pushed the FAO food price index to its highest since late 2022, but insured catastrophe losses for the first nine months of 2026 were the lowest since 2019. By 2029 effects likely arrive as price pressure, not the defining event.
uncertainty: 2
uncertainty_why: Warming's direction is near-certain (WMO gives 70% to a 2025-2029 average above 1.5C). The size of extremes is noise rather than a fork.
resolves_by_2029: partly
scored: '2026-11-04'
