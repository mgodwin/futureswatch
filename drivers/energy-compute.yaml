id: energy-compute
name: Energy and compute supply
domain: tech
question: By the end of 2029, do power, grid and chip supply keep pace with AI demand, or does supply become the binding limit on AI growth and household bills?
poles:
- Supply keeps up and AI growth is not power- or chip-limited
- Shortages cap the build-out and cause grid emergencies and price spikes
impact: 4
impact_why: It reaches daily life through electricity bills and grid reliability, and it gates AI scaling. PJM's 2028/29 auction cleared at the price cap and came in 6.8 GW short.
uncertainty: 3
uncertainty_why: Tightness through 2027 and 2028 is near-consensus (memory booked through 2027, a power shortfall estimated near 32 GW). The split is over the end-state, with some analysts expecting data-center overcapacity by 2028.
resolves_by_2029: 'yes'
scored: '2026-11-04'
