id: world-order
name: 'World order: stable or fractured'
domain: geopolitics
question: At the end of 2029, is the international system broadly stable, or has it fractured into hostile blocs with at least one great-power or regional war defining the period?
poles:
- Bent but stable order
- Fractured blocs and a defining war
impact: 5
impact_why: 'An umbrella over every era-defining geopolitical tail: a Taiwan war, a NATO-Russia war, a Gulf war with oil above $150, nuclear use.'
