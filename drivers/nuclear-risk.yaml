id: nuclear-risk
name: Nuclear use, testing and proliferation
domain: geopolitics
question: By the end of 2029, has the nuclear order only eroded, or has there been nuclear use, resumed explosive testing by a major power, or a new nuclear state?
poles:
- Erosion without use or new testing
- Nuclear use or a cascade of tests and proliferation
impact: 3
impact_why: 'Bimodal: any use would define the era, but the likely range (arms-control collapse, a testing debate) barely touches daily life by 2029. New START lapsed in February 2026.'
uncertainty: 2
uncertainty_why: Erosion is the clear direction and use stays a low-probability tail on Metaculus and Manifold. Iran's unverified enriched uranium is the main wildcard.
resolves_by_2029: 'no'
scored: '2026-11-04'
