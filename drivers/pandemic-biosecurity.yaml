id: pandemic-biosecurity
name: Pandemic and biosecurity
domain: health
question: By the end of 2029, has a natural or engineered pathogen caused a COVID-scale pandemic, or do outbreaks stay regional?
poles:
- Pandemic over 1M deaths reshapes daily life
- Outbreaks contained regionally
impact: 4
impact_why: The tail would define the era. The current Bundibugyo Ebola outbreak has no licensed vaccine and US preparedness is weaker, but the likeliest outcome is containment.
uncertainty: 2
uncertainty_why: 'Forecasts lean clearly one way: the repo puts a pandemic killing over 1 million at 6%, near the 4 to 5% historical base rate, and H5N1 shows no person-to-person spread.'
resolves_by_2029: 'yes'
scored: '2026-11-04'
correlated_with:
- id: biotech
  why: dual-use tools and countermeasures
- id: ai-capability
  why: AI-enabled bio uplift
- id: ai-control
  why: a bio-misuse incident would trigger AI limits
