id: ai-control
name: AI control and governance
domain: tech
question: By the end of 2029, is frontier AI governed by binding pre-release controls, or emergency brakes after a major incident, or still an open race?
poles:
- A major AI incident triggers sweeping limits or a pause
- An open race with few binding rules
impact: 4
impact_why: The regime sets how fast AI is released and who gets it. 2026 already brought an FTC probe of labs, agent incidents in testing and a model shelved after safety tests.
uncertainty: 4
uncertainty_why: No market prices the regime. US federal preemption is stalled with no statute, the EU has delayed high-risk rules to 2027 and 2028, and the repo's judgment-only split is 18 open, 65 managed, 17 brakes.
resolves_by_2029: partly
scored: '2026-11-04'
