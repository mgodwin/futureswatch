headline: A wild week for AI stocks and an AI-run hack of the EU Commission nudge a few AI odds, while every world holds and Steady Climb stays most likely at 28%.
thisWeek:
- 'This short update covers the five days since Nov 19, after the Nov 23 run was skipped. Every world held: Steady Climb is still most likely at 28%, then Takeoff at 27%, Hangover at 24% and Fracture at 21%. Black Mirror and Cyberpunk stay tied as the likeliest sci-fi futures at 29% each.'
- AI stocks had their roughest week of the boom. The Nasdaq fell 5.3% on Nov 20 and Nvidia 14% amid an SEC review of its accounting, then the Nasdaq jumped 6.5% on Nov 23 when Nvidia rehired Jensen Huang. A crash-and-recover path edged up to 46%; bust and recession odds held, and Kalshi's 2027 recession odds slipped to 21%.
- An attack using the ARTEX AI hacking framework kept European Commission staff systems down for over 10 days, and more than two dozen OpenAI and Anthropic insiders said their unreleased models are hard to control. Major AI-cyber odds rose to 38%, emergency brakes to 19% and a lab slowdown to 32%, one point each, since no market moved.
- 'No question changed its leading outcome or focus band. Most likely 2030 now covers the four newest questions: US debt holds calmly, no major power tests a nuclear weapon, the 2028 handover goes normally and tariffs stay high without hardening blocs. No checks resolved, so the running Brier score stays 0.07 over four checks; the January Fed hike check fell to 54%.'
- 'Next week: the November jobs report on Dec 4 and the Fed on Dec 9, where a hike is priced near 94%. Also watch whether Iran talks restart under Trump''s early-2027 deadline and whether AI stocks hold their rebound.'
