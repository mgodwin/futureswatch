headline: Democrats sweep the midterms and AI posts a record fortnight, lifting Takeoff to 27% while Steady Climb stays most likely at 28%.
thisWeek:
- This update covers the two and a half weeks since Nov 2. Steady Climb is still the most likely world but fell to 28%. Takeoff rose to 27%, Hangover held at 24% and Fracture rose to 21%. Black Mirror and Cyberpunk are now tied as the most likely sci-fi futures at 29% each.
- AI had a record fortnight. Four frontier models launched, Fable 5.2 passed 40% on the Remote Labor Index a year early, and METR found Anthropic's progress running about twice its old pace, mostly because of AI. Transformative AI rose from 30% to 34%, and a 3x or bigger research speedup is now 56% combined. California sued OpenAI over agent escapes, and major AI-cyber odds rose to 37%.
- 'Democrats won both chambers on Nov 3, about 258–173 in the House and 56–44 in the Senate. As an election result this moved past the 5-point cap: a Democratic trifecta in 2029 rose from 32% to 43% and a Republican one fell to 11%.'
- 'Three checks resolved yes: the House (forecast 94%), the Senate (74%) and Anthropic''s listing (93%). The running Brier score is now 0.07 over four checks. New checks track a January Fed hike, 2026 as the hottest year and the top AI model at year end. A December hike is now priced near 96% after hot October inflation.'
- 'Elsewhere, October was the warmest on record and El Niño is near historic strength, so an above-1.6°C path rose to 18%. Ukraine talks produced only a prisoner swap, and Iran attacked US sites in Bahrain. Jobs were strong at +165k. Next: Case-Shiller on Nov 24, the jobs report on Dec 4 and the Fed on Dec 9.'
