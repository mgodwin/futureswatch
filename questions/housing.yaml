id: housing
tracking: active
title: What happens to home prices?
short: Where US home prices stand after inflation at the end of 2029, measured by the Case-Shiller national index against CPI from August 2026.
domain: economy
area: money
order: 27
read: Prices are still rising about 2% a year, but inflation is higher, so homes have lost real value for 15 straight months. With mortgage rates above 7% and forecasters expecting under 1% price growth in 2027, a slow real slide is the central case.
outcomes:
- key: rise
  label: Real prices rise
  prob: 15
  prevProb: null
  desc: The Case-Shiller national index beats CPI by more than 5% between August 2026 and December 2029.
  ifThen: Owners keep building wealth and renters fall further behind. This most likely needs mortgage rates to fall back toward 6% while supply stays tight.
- key: hold
  label: Roughly hold
  prob: 38
  prevProb: null
  desc: Real prices end within 5% of their August 2026 level, either way.
  ifThen: Little change in affordability. Wages slowly catch up, but high rates keep many owners locked in and sales low.
- key: slide
  label: Slow real slide
  prob: 37
  prevProb: null
  desc: Real prices fall 5% to 15%, mostly because nominal prices lag inflation rather than crash.
  ifThen: Homes get a little more affordable each year without a crash. Recent buyers feel poorer, and builders slow down.
- key: drop
  label: Sharp drop
  prob: 10
  prevProb: null
  desc: Real prices fall more than 15%, as in a recession with forced sales or a spike in rates.
  ifThen: Falling equity, more defaults in some markets and a hit to consumer spending, but a real opening for first-time buyers. Even with cheap goods from AI and energy, land and good locations stay scarce, so a drop like this would come from credit and jobs, not abundance.
