title: What if control of Washington shifts?
short: Which party holds the White House and Congress in 2029, after the 2028 election.
domain: politics
order: 14
read: On the eve of the vote, markets give Democrats 94% for the House and 74% for the Senate. Holding both in 2029 still needs a 2028 win, so divided government stays likeliest.
outcomes:
- key: dtrifecta
  label: Democratic trifecta
  prob: 32
  prevProb: 30
  desc: Democrats win the White House in 2028 and hold both chambers.
  ifThen: Likely federal AI licensing and labor rules, higher taxes on capital, tighter chip export policy toward China stays.
- key: divided
  label: Divided government
  prob: 49
  prevProb: 50
  desc: No party controls the presidency and both chambers.
  ifThen: Gridlock on big bills; policy moves through executive orders, courts and states.
- key: rtrifecta
  label: Republican trifecta
  prob: 19
  prevProb: 20
  desc: Republicans win the White House in 2028 and hold both chambers.
  ifThen: Lighter AI rules with federal preemption of states, tariffs and energy build-out continue.
