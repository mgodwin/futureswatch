id: ai-boom
tracking: active
title: What if the AI boom is a bubble?
short: AI investment and AI-heavy stocks through 2029.
domain: economy
area: money
order: 4
read: Demand is real, but the cash is running thin. Alphabet and Amazon now spend more than they earn, and Alphabet had its worst day since listing.
outcomes:
- key: sustained
  label: Sustained build-out
  prob: 29
  prevProb: 30
  desc: Capex keeps rising through 2029; dips are brief.
  ifThen: Chip, power and data-center businesses keep booming, and AI adoption accelerates.
- key: correction
  label: Sharp correction, then recovery
  prob: 46
  prevProb: 46
  desc: AI-heavy stocks fall 35% or more from their peak and/or hyperscalers cut capex, then recover.
  ifThen: A rough year for tech jobs and portfolios, then the build-out resumes.
- key: bust
  label: Deep bust
  prob: 25
  prevProb: 24
  desc: The unwind feeds a recession, with losses on data-center debt.
  ifThen: 'The Hangover world: layoffs, falling asset prices and a slower AI rollout.'
anchors:
