# Copy to questions/<id>.yaml, fill it in, and keep tracking: proposed.
# Outcomes must be mutually exclusive and their prob values must sum to 100.
# Field guide: CONTRIBUTING.md
id: your-question-id
tracking: proposed
title: Will … by 2030?
short: One sentence on what's forecast, by the end of 2029.
domain: tech          # ai, economy, energy, geopolitics, politics, tech, education or health
area: work          # ai, work, money, health, tech or world (the life area it is grouped under)
order: 99
read: Two sentences on the current state of the evidence.
outcomes:
- key: yes
  label: It happens
  says: Yes, it happens
  prob: 30
  prevProb: null
  desc: What this outcome means, concretely.
  ifThen: What the world looks like if it does.
- key: no
  label: It doesn't
  says: No, it doesn't happen
  prob: 70
  prevProb: null
  desc: What this outcome means, concretely.
  ifThen: What the world looks like if it doesn't.
anchors:
- who: Who made the forecast
  what: What they forecast, paraphrased.
  date: "2026-10"
  url: https://example.org/forecast
signals: []
