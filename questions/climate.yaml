id: climate
tracking: active
title: How hot will 2025 to 2029 run?
short: Average global temperature for 2025–2029 above preindustrial, as measured by Copernicus.
domain: energy
area: world
order: 8
read: October set a record at 1.75°C above preindustrial, and El Niño hit the +2.5°C record mark. A very hot 2027 now looks likely, pulling the five-year average toward 1.6°C.
outcomes:
- key: below
  label: Below 1.5°C
  says: Under 1.5°C above preindustrial
  prob: 11
  prevProb: 14
  desc: The five-year average stays under the Paris 1.5°C level.
  ifThen: A little more time, though still with record-warm years.
- key: over
  label: 1.5–1.6°C
  says: Just past the 1.5°C line, at 1.5 to 1.6°C
  prob: 71
  prevProb: 72
  desc: The 1.5°C level is exceeded on a five-year average.
  ifThen: '1.5°C is effectively crossed: more heat waves, rising insurance costs and food-price swings.'
- key: wellover
  label: Above 1.6°C
  says: Above 1.6°C, running hot
  prob: 18
  prevProb: 14
  desc: Warming runs hot, with 2027 setting a large new record and little cooling after.
  ifThen: Faster-than-expected warming, stronger extremes and harder fights over adaptation costs.
anchors:
- who: Copernicus
  what: 2025 averaged 1.47°C; 2023–25 was the first three-year span above 1.5°C.
