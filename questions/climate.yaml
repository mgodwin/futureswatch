id: climate
tracking: active
title: What if warming accelerates?
short: Average global temperature for 2025–2029 above preindustrial, as measured by Copernicus.
domain: energy
area: world
order: 8
read: El Niño reached +2.1°C and NOAA now gives 83% odds of record strength this winter. September ran 1.63°C above preindustrial, so the five-year average is loading high.
outcomes:
- key: below
  label: Below 1.5°C
  prob: 14
  prevProb: 14
  desc: The five-year average stays under the Paris 1.5°C level.
  ifThen: A little more time, though still with record-warm years.
- key: over
  label: 1.5–1.6°C
  prob: 72
  prevProb: 72
  desc: The 1.5°C level is exceeded on a five-year average.
  ifThen: '1.5°C is effectively crossed: more heat waves, rising insurance costs and food-price swings.'
- key: wellover
  label: Above 1.6°C
  prob: 14
  prevProb: 14
  desc: Warming runs hot, with 2027 setting a large new record and little cooling after.
  ifThen: Faster-than-expected warming, stronger extremes and harder fights over adaptation costs.
