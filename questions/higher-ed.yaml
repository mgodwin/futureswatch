id: higher-ed
tracking: active
title: How much will AI shake up college?
short: Whether AI and money pressures reshape colleges, degrees and how students learn by the end of 2029.
domain: education
area: work
order: 17
read: Undergraduate enrollment still grew this fall, but only 0.6%. Master's and computer science enrollment fell sharply. No forecasting market covers this, so these odds rest on judgment.
outcomes:
- key: adapts
  label: Adapts
  says: Colleges adapt, and degrees still pay
  prob: 50
  prevProb: 50
  desc: Enrollment holds roughly steady, closures stay under about 25 a year and degrees keep a wage premium above 70%. AI becomes a standard study and teaching tool.
  ifThen: A degree still pays, but the major matters more; AI skills get folded into most programs.
- key: squeezed
  label: Squeezed
  says: Over 100 colleges close, or degrees pay less
  prob: 40
  prevProb: 40
  desc: Over 100 colleges close or merge from 2026 to 2029, or the wage premium falls below 70%. Majors shift sharply and more employers drop degree requirements.
  ifThen: Small private and regional colleges shrink; families weigh cost and job payoff much harder.
- key: unbundled
  label: Unbundled
  says: AI tutors and credentials replace many degrees
  prob: 10
  prevProb: 10
  desc: AI tutoring and skills credentials replace degrees for a large share of students; undergraduate enrollment falls 10% or more from 2025.
  ifThen: Credentials and portfolios replace diplomas for many jobs; schools compete on mentoring and networks.
anchors:
- who: Azar, Giné and Sanz-Espín (working paper)
  what: The college wage premium fell from about 87% in 2022 to 78% in 2026, back to mid-1990s levels.
  date: 2026-09
  url: https://marginalrevolution.com/marginalrevolution/2026/09/the-college-wage-premium-in-the-generative-ai-era.html
- who: National Student Clearinghouse
  what: Undergraduate enrollment rose 0.6% this fall, led by community colleges. Master's fell 3.7% and computer science at four-year colleges fell 12.4%.
  date: 2026-10
  url: https://www.studentclearinghouse.org/news/total-higher-ed-enrollment-holds-steady-in-preliminary-fall-enrollment-trends-report/
- who: NAFSA
  what: Projects up to 112,000 fewer international students this fall and $3.4B in lost revenue.
  date: 2026-08
  url: https://www.forbes.com/sites/michaeltnietzel/2026/08/12/projected-loss-of-international-students-could-bring-a-34-billion-hit/
