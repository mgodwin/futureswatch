title: Will another pandemic hit?
short: A new pandemic that kills more than 1 million people before 2030.
domain: health
area: health
order: 12
read: Ebola has passed 11,000 cases in DRC and Africa CDC says it is not under control, but it spreads slowly. H5N1 killed a Washington dairy worker in November, still with no human-to-human spread.
outcomes:
- key: 'no'
  label: Nothing at that scale
  says: No pandemic that kills over a million people
  prob: 94
  prevProb: 94
  desc: Outbreaks happen but stay below a million deaths.
  ifThen: Emergencies like this year's Ebola outbreak stay regional.
- key: 'yes'
  label: Major pandemic
  says: Yes, one that kills over a million people
  prob: 6
  prevProb: 6
  desc: A WHO-declared emergency that kills more than 1 million people.
  ifThen: 'The Fracture world: lockdown-style disruption, supply shocks and a hit to growth.'
anchors:
