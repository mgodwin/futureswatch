title: What if another pandemic hits?
short: A new pandemic that kills more than 1 million people before 2030.
domain: health
order: 12
read: Ebola is deadly but spreads slowly, and H5N1 shows no human-to-human transmission. Weakened WHO and CDC capacity nudges the risk up.
