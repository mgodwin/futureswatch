title: Will China catch up in AI?
short: Whether the US keeps a clear lead in frontier AI through 2029.
domain: ai
area: ai
order: 15
read: China's best models trail by roughly 6 months, and Epoch's index shows the gap widening this fall as US labs set new records. A Nov 16 US rule targets chips reaching Chinese firms through overseas data centers, while Huawei keeps gaining share at home.
