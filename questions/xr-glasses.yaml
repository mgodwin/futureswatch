id: xr-glasses
tracking: active
title: Will smart glasses go mainstream?
short: Whether smart glasses and VR or AR headsets become a mass-market device by the end of 2029, or stay niche.
domain: tech
area: tech
order: 33
read: Smart glasses are growing fast, led by Meta's Ray-Bans, and now make up about 85% of XR shipments while VR headsets shrink. Still, IDC counted only about 3.5 million devices in the second quarter of 2026, and about 5% of US adults own camera glasses.
outcomes:
- key: niche
  label: Stays niche
  says: No, they stay niche
  prob: 25
  prevProb: null
  desc: Fewer than 25 million smart glasses and headsets ship worldwide in 2029, as counted by IDC.
  ifThen: Smart glasses stay a gadget for early adopters, like VR before them. Privacy worries and weak use cases hold them back, and phones stay the main screen.
- key: growing
  label: Real but not mainstream
  says: A real market, but not mainstream
  prob: 60
  prevProb: null
  desc: Between 25 million and 75 million ship in 2029.
  ifThen: Glasses become a familiar sight, much like early smartwatches. Many people use them for calls, music, photos and AI help, but most still don't own a pair.
- key: mainstream
  label: Goes mainstream
  says: Yes, as common as smartwatches
  prob: 15
  prevProb: null
  desc: More than 75 million ship in 2029, roughly the scale smartwatches reached.
  ifThen: AI glasses become a common everyday device. People talk to assistants through their glasses, and camera glasses in public prompt new privacy rules.
anchors:
- who: IDC (via TechNode)
  what: 3.547 million smart glasses and headsets shipped worldwide in Q2 2026, up 35%; VR headsets fell 23% to 548,000.
  date: "2026-09"
