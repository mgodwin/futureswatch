- who: IDC (via Mixed)
  what: Glasses were about 85% of XR shipments in Q2 2026; unit growth forecast at 26% in 2026, 41% in 2027 and 26% in 2028.
  date: "2026-09"
  url: https://mixed-news.com/en/idc-smart-glasses-shipments-q2-2026-vr-headsets-decline
- who: Counterpoint Research
  what: AI glasses shipments rose 263% year on year in H1 2026; 96% had no display, and Meta had about 94% of display-less shipments.
  date: "2026-09"
  url: https://counterpointresearch.com/en/insights/global-ai-glasses-shipments-surge-263-percent-yoy-with-display-less-ai-glasses
- who: EssilorLuxottica (via UploadVR)
  what: Over 7 million Ray-Ban and Oakley Meta smart glasses sold in 2025, more than triple 2024.
