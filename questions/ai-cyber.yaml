id: ai-cyber
tracking: active
title: What if AI drives a major cyberattack?
short: Whether an attack led by AI causes at least $1B in damage or 100 deaths by the end of 2029.
domain: ai
area: ai
order: 13
read: Attackers already use AI-written code against industrial controllers, and one hacker used AI agents to breach over 100 firms cheaply. One thin market covers this, so these odds rest mostly on judgment.
outcomes:
- key: contained
  label: Contained
  prob: 57
  prevProb: 57
  desc: AI-assisted attacks keep growing, but no single AI-driven incident causes $1B in damage or 100 deaths.
  ifThen: Cyber stays a cost of doing business; defenders' AI keeps pace.
- key: major
  label: Major incident
  prob: 35
  prevProb: 35
  desc: At least one attack led by AI causes $1B+ in damage or 100+ deaths, without lasting national disruption.
  ifThen: Fast rules on agent access and model release; a strong push toward Emergency brakes.
- key: systemic
  label: Systemic attack
  prob: 8
  prevProb: 8
  desc: An AI-driven attack knocks out power, water, payments or hospitals across a region for days, or kills 1,000+ people.
  ifThen: Emergency AI controls, a security-first politics and possible military retaliation.
