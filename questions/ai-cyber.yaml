id: ai-cyber
tracking: active
title: How bad will AI cyberattacks get?
short: Whether an attack led by AI causes at least $1B in damage or 100 deaths by the end of 2029.
domain: ai
area: ai
order: 13
read: Attackers using an AI hacking framework kept European Commission payroll and medical claims systems offline for over 10 days, and the FBI warns the same kit is in wide use. No single AI-driven attack has yet been shown to cause $1B in damage.
outcomes:
- key: contained
  label: Contained
  says: More attacks, but none causes $1B in damage
  prob: 54
  prevProb: 55
  desc: AI-assisted attacks keep growing, but no single AI-driven incident causes $1B in damage or 100 deaths.
  ifThen: Cyber stays a cost of doing business; defenders' AI keeps pace.
- key: major
  label: Major incident
  says: One causes $1B in damage or 100 deaths
  prob: 38
  prevProb: 37
  desc: At least one attack led by AI causes $1B+ in damage or 100+ deaths, without lasting national disruption.
  ifThen: Fast rules on agent access and model release; a strong push toward Emergency brakes.
- key: systemic
  label: Systemic attack
  says: One knocks out power, water or hospitals for days
  prob: 8
  prevProb: 8
  desc: An AI-driven attack knocks out power, water, payments or hospitals across a region for days, or kills 1,000+ people.
  ifThen: Emergency AI controls, a security-first politics and possible military retaliation.
anchors:
- who: Manifold market
  what: 47% that an AI-caused incident costs $1B or 100 lives by the end of 2029, from any cause. Thinly traded.
