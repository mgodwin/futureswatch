id: trade-blocs
tracking: active
title: Will the world split into trade blocs?
short: How high US tariffs stand at the end of 2029, measured by the Yale Budget Lab's average effective tariff rate.
domain: economy
area: world
order: 36
read: The average US tariff rate is about 11%, down from over 22% after the April 2025 tariffs but about four times the 2024 level. The US–China truce runs to January 10, 2027, and markets favor Democrats in 2028, which makes a partial rollback plausible.
outcomes:
- key: rolledback
  label: Rolled back
  says: Tariffs come back down toward normal
  prob: 30
  prevProb: 30
  desc: The average effective tariff rate is under 8% at the end of 2029, after deals, court rulings or a new administration cut tariffs.
  ifThen: Goods prices ease, supply chains stop reshuffling, and trade is no longer a source of Fracture risk.
- key: stayshigh
  label: Stays high
  says: Tariffs stay high, but trade keeps flowing
  prob: 55
  prevProb: 55
  desc: The rate stays between 8% and 20%, with truces renewed and no broad decoupling from China.
  ifThen: A permanent tax on imports that keeps goods inflation sticky, but no split into rival blocs.
- key: blocs
  label: Blocs harden
  says: The world splits into rival trade blocs
  prob: 15
  prevProb: 15
  desc: The rate is above 20%, or the US and China decouple broadly in chips, rare earths and key goods, with allies following one side.
  ifThen: Higher prices, a hit to growth and chip supply, and a world that looks much more like Fracture.
