id: ai-control
tracking: active
title: How tightly will governments control AI?
short: How tightly frontier AI is controlled by the end of 2029.
domain: ai
area: ai
order: 3
read: 'Pressure is building: the FTC subpoenaed OpenAI and Anthropic, eight states sued OpenAI and labs disclosed more agent incidents. No forecasting market covers this, so these odds rest on judgment.'
outcomes:
- key: open
  label: Open race
  says: Hardly at all, and new models ship freely
  prob: 18
  prevProb: 18
  desc: Few binding rules; frontier releases go out largely unhindered.
  ifThen: Faster spread of capabilities, and more room for misuse.
- key: managed
  label: Managed release
  says: Governments test new models before release
  prob: 65
  prevProb: 65
  desc: Government pre-release testing and case-by-case approvals become routine, as began in 2026.
  ifThen: Slower, staggered releases; access to the strongest models depends on approvals.
- key: brakes
  label: Emergency brakes
  says: An AI incident triggers a pause or hard limits
  prob: 17
  prevProb: 17
  desc: 'A serious AI incident triggers sweeping limits: a moratorium, compute caps or an international pause.'
  ifThen: A sudden slowdown in AI progress and rollout, and a scramble over who keeps access.
anchors:
- who: Federal Trade Commission
  what: Sent civil subpoenas to OpenAI and Anthropic in a consumer-protection probe that follows several agent incidents.
  date: 2026-10
  url: https://www.axios.com/2026/10/15/ftc-openai-anthropic-ai-safety-investigation
- who: Google
  what: Limited its Gemini 4 Argon frontier model to vetted cyber defenders and gave the US government early access.
  date: 2026-10
  url: https://arynews.tv/google-restricts-access-new-ai-model-safety-concerns
- who: White House
  what: A June executive order set up voluntary government access to frontier models before release.
  date: 2026-06
  url: https://www.skadden.com/insights/publications/2026/06/new-ai-executive-order
- who: Anthropic
  what: Suspended access to Claude Fable 5 and Mythos 5 from June 12 to 30 to comply with Commerce Department export controls, restoring it on July 1.
  date: 2026-07
  url: https://www.anthropic.com/news/fable-mythos-access
- who: Reuters / Wall Street Journal
  what: OpenAI shelved a new model after internal safety tests raised concerns, including deception.
  date: 2026-09
  url: https://www.thestar.com.my/tech/tech-news/2026/09/29/openai-shelves-new-ai-model-after-internal-safety-tests-wsj-reports
- who: INCIBE (Spain's cybersecurity institute)
  what: Reported that OpenAI agents under internal testing breached Hugging Face systems in July.
  date: 2026-09
  url: https://www.incibe.es/en/incibe-cert/publications/cybersecurity-highlights/security-incident-involving-openais-ai-agents-targeting-hugging-face
- who: European Union
  what: The AI Omnibus delays high-risk AI rules to December 2027 and August 2028.
  date: 2026-07
  url: https://www.hunton.com/privacy-and-cybersecurity-law-blog/eu-digital-omnibus-on-ai-enters-into-force
signals:
- incidents
- rnd
